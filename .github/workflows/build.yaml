name: Elixir CI

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.actor }}/job-applications:latest

jobs:
  container-job:
    runs-on: ubuntu-latest
    container: hexpm/elixir:1.11-erlang-24.3.4.9-ubuntu-jammy-20260509
   
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: job_applications_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Restore dependencies cache
      uses: actions/cache@v3
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-

    - name: Install Hex package manager
      run: mix local.hex --force
      
    - name: Install git
      run: apt-get update && apt-get install -y git
      
    - name: Install dependencies
      run: mix deps.get
      
    - name: Run tests
      run: mix test
      env:
        POSTGRES_HOST: postgres
        
    - name: Login container registry
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

    - name: Create Dockerfile
      run: mix phx.gen.release --docker
      
    - name: Build and Push Docker image
      run: |
        docker build . -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}